
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California House Price Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>California House Price Predictor</h1>

            <p>
                Enter the house details below to estimate the house price.
            </p>
        </div>


        <div class="card">

            <form action="/predict" method="POST">

                {% for column in columns %}

                <div class="input-group">

                    <label for="{{ column }}">
                        {{ column }}
                    </label>

                    <input
                        type="number"
                        step="any"
                        name="{{ column }}"
                        id="{{ column }}"
                        placeholder="Enter value"
                        required
                    >

                </div>

                {% endfor %}


                <button type="submit">
                    Predict House Price
                </button>

            </form>


            {% if prediction is defined %}

            <div class="result">

                <h2>Prediction Result</h2>

                <p>Estimated House Value</p>

                <h3>{{ prediction }}</h3>

            </div>

            {% endif %}

        </div>


        <footer>
            California Housing Prediction • Machine Learning
        </footer>

    </div>

</body>

</html>
